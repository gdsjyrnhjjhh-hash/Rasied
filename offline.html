<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#182763" />
<title>لا يوجد اتصال — رصيد</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Cairo,Tahoma,Arial,sans-serif;background:#f3f5fa;color:#0e1630}
  .box{max-width:380px;text-align:center;background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:36px 28px;box-shadow:0 10px 30px rgba(24,39,99,.08)}
  img{width:84px;height:84px;margin-bottom:8px}
  h1{font-size:20px;margin:6px 0 8px;color:#182763}
  p{margin:0 0 22px;color:#5b6784;line-height:1.8;font-size:14px}
  button{font:inherit;font-weight:600;padding:11px 30px;border:0;border-radius:12px;background:#2a49d6;color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#0b1020;color:#e8ecf8}.box{background:#131a30;border-color:#232c49}h1{color:#cfd8ff}p{color:#9aa6c6}}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/img/icon-192.png" alt="رصيد" />
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>رصيد يحتاج اتصالًا لعرض بياناتك وحفظها بأمان. تأكد من الشبكة ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
  <script>window.addEventListener("online",function(){location.reload()})</script>
</body>
</html>
